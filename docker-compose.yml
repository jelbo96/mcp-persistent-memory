volumes:
  redis_data:
    driver: local
  redisinsight_data:
    driver: local

networks:
  memory-network:
    driver: bridge

services:
  redis:
    image: redis/redis-stack-server:latest
    ports:
      - "63790:6379"
    volumes:
      - redis_data:/data
    environment:
      - REDIS_ARGS=--appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - memory-network

  api:
    image: redislabs/agent-memory-server:0.15.2
    ports:
      - "18000:8000"
    env_file:
      - path: .env
        required: true
    environment:
      - REDIS_URL=redis://redis:6379
      - PORT=8000
      - GENERATION_MODEL=anthropic/claude-sonnet-5-5
      - FAST_MODEL=anthropic/claude-haiku-5-5
      - EMBEDDING_MODEL=text-embedding-3-small
      - LONG_TERM_MEMORY=True
      - ENABLE_TOPIC_EXTRACTION=True
      - ENABLE_NER=True
      - DISABLE_AUTH=true
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - memory-network

  mcp:
    image: redislabs/agent-memory-server:0.15.2
    ports:
      - "9050:9000"
    env_file:
      - path: .env
        required: true
    environment:
      - REDIS_URL=redis://redis:6379
      - PORT=9000
      - GENERATION_MODEL=anthropic/claude-sonnet-5-5
      - FAST_MODEL=anthropic/claude-haiku-5-5
      - EMBEDDING_MODEL=text-embedding-3-small
      - LONG_TERM_MEMORY=True
      - ENABLE_TOPIC_EXTRACTION=True
      - ENABLE_NER=True
      - DISABLE_AUTH=true
    depends_on:
      redis:
        condition: service_healthy
    command: ["agent-memory", "mcp", "--mode", "sse"]
    networks:
      - memory-network

  task-worker:
    image: redislabs/agent-memory-server:0.15.2
    env_file:
      - path: .env
        required: true
    environment:
      - REDIS_URL=redis://redis:6379
      - GENERATION_MODEL=anthropic/claude-sonnet-5-5
      - FAST_MODEL=anthropic/claude-haiku-5-5
      - EMBEDDING_MODEL=text-embedding-3-small
      - LONG_TERM_MEMORY=True
      - ENABLE_TOPIC_EXTRACTION=True
      - ENABLE_NER=True
      - DISABLE_AUTH=true
    depends_on:
      redis:
        condition: service_healthy
    command: ["agent-memory", "task-worker"]
    restart: unless-stopped
    networks:
      - memory-network

  redis-insight:
    profiles: ["debug"]
    image: redis/redisinsight:latest
    ports:
      - "16381:5540"
    volumes:
      - redisinsight_data:/db
    depends_on:
      - redis
    networks:
      - memory-network
